# Infrastructure locale de PedalPilot (PostgreSQL + Redis).
# En production : Neon (Postgres) + Upstash (Redis) ou ces memes conteneurs sur le VPS.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pedalpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pedalpilot
      POSTGRES_PASSWORD: pedalpilot
      POSTGRES_DB: pedalpilot
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedalpilot -d pedalpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pedalpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
